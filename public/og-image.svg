<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="web" x1="120" y1="170" x2="520" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D8FF"/>
      <stop offset=".5" stop-color="#018AFE"/>
      <stop offset="1" stop-color="#651EFE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(530 270 -220 432 740 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172B7A" stop-opacity=".62"/>
      <stop offset="1" stop-color="#080B1D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#CBD5FF" fill-opacity=".12"/>
    </pattern>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700");
      @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900");
    </style>
  </defs>
  <rect width="1200" height="630" fill="#080B1D"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="123" y="52" width="174" height="33" rx="16.5" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="137" y="73" fill="#00D8FF" font-size="12" font-weight="700" letter-spacing="1.4">ESTÚDIO VIRTUAL</text>

    <g fill="#F8FAFF" font-family="Orbitron, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-1.8">
      <text x="123" y="146">Software</text>
      <text x="123" y="202">house:</text>
      <text x="123" y="258">Soluções <tspan fill="url(#web)">sob</tspan></text>
      <text x="123" y="314"><tspan fill="url(#web)">medida</tspan> para o</text>
      <text x="123" y="370">seu negócio</text>
    </g>

    <g fill="#D5DFF3" font-size="17" font-weight="400">
      <text x="123" y="410">Sites, aplicativos, software personalizado, SaaS, ERP,</text>
      <text x="123" y="435">agentes de IA e automação. Criamos o produto sob medida</text>
      <text x="123" y="460">para resolver o problema real da sua empresa.</text>
    </g>

    <rect x="123" y="500" width="226" height="43" rx="11" fill="#00D8FF"/>
    <g transform="translate(143 511)" stroke="#080B1D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
      <circle cx="9" cy="9" r="7.5"/>
      <path d="m5.5 15.5-1 3 3.5-1M6.5 6.5c.3 2.8 2.2 4.7 5 5"/>
      <path d="M11 10c-.6 0-1.3-.6-1.7-1.2-.3-.5 0-1 .4-1.3l.4-.3"/>
    </g>
    <text x="174" y="527" fill="#080B1D" font-size="12" font-weight="700">Solicitar orçamento gratuito</text>

    <rect x="360" y="500" width="116" height="43" rx="11" stroke="#FFFFFF" stroke-opacity=".18"/>
    <text x="382" y="527" fill="#F8FAFF" font-size="12" font-weight="700">Ver serviços</text>
  </g>

  <image href="hero-illustration.svg" x="606" y="112" width="490" height="398"/>
</svg>
